# Lives in TheRadicalOnes/.github at .github/workflows/request-review-slack.yml
# Reusable workflow: posts a PR to #pull-requests when it has the `needs review` label and isn't a draft.
# Each repo calls this with a small caller file. Change the message or rules here only.
name: Request review in Slack (reusable)

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack:
    # Post when:
    #  - someone adds the "needs review" label to a non-draft PR, or
    #  - a draft that already has the label is marked "Ready for review"
    if: >
      (github.event.action == 'labeled'
        && github.event.label.name == 'needs review'
        && github.event.pull_request.draft == false)
      || (github.event.action == 'ready_for_review'
        && contains(github.event.pull_request.labels.*.name, 'needs review'))
    runs-on: ubuntu-latest
    steps:
      - name: Post PR to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          payload=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg num "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg add "$PR_ADDITIONS" \
            --arg del "$PR_DELETIONS" \
            --arg files "$PR_FILES" \
            --arg repo "$REPO_NAME" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");

            ($title | esc) as $t
            | {
                text: "Review requested: #\($num) \($t)",
                blocks: (
                  [
                    { type: "section",
                      text: { type: "mrkdwn", text: "*<\($url)|#\($num) \($t)>*" } },
                    { type: "context",
                      elements: [ { type: "mrkdwn",
                        text: ":eyes: Review requested in *\($repo)* by *\($author)*  ·  `\($head | esc)` → `\($base | esc)`  ·  +\($add) −\($del)  ·  \($files) file\(if $files == "1" then "" else "s" end)" } ] }
                  ]
                  + [
                    { type: "actions",
                      elements: [ { type: "button", style: "primary",
                                    text: { type: "plain_text", text: "Review PR" },
                                    url: $url } ] }
                  ]
                )
              }')

          curl -sS --fail -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
