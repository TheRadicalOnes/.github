# Reusable workflow: adds the org PR template to PRs opened without it
# (Gearset, gh CLI, IDEs, bots). The website already pre-fills it.
# Repos call this from .github/workflows/pr-template.yml (see the README).
name: PR template

on:
  workflow_call:

jobs:
  fill:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Gearset promotion PRs are releases, not feature work.
            if (pr.head.ref.startsWith('gs-pipeline/')) return core.info('Gearset promotion PR, skipping.');
            if (pr.user.type === 'Bot') return core.info('Bot PR, skipping.');
            if (body.includes('<!-- skip-pr-template -->')) return core.info('Opted out, skipping.');
            if (body.includes('## Task') && body.includes('## Checklist')) return core.info('Template already present.');

            const { data } = await github.rest.repos.getContent({
              owner: 'TheRadicalOnes',
              repo: '.github',
              path: '.github/pull_request_template.md',
            });
            const template = Buffer.from(data.content, 'base64').toString('utf8');

            const original = body.trim()
              ? `\n\n---\n\n**Original description:**\n\n${body.trim()}\n`
              : '';

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: template + original,
            });
            core.info('PR template added.');
